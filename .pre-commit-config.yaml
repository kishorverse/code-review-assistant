# Install once from backend/:  uv run pre-commit install
# Run on everything:            uv run pre-commit run --all-files
#
# eval/datasets/ holds code with deliberately injected bugs, style issues and a
# fake secret for the evaluation; linters must not "fix" them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig files are JSON with comments, which strict JSON parsing rejects.
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: ^eval/datasets/
      - id: ruff-format
        exclude: ^eval/datasets/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (package-lock\.json$|uv\.lock$|^eval/datasets/)
